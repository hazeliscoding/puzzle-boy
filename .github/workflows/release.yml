name: Release

# A v* tag publishes a GitHub release. A manual run only builds and checks the archives, as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Every build comes from Linux: MonoGame's packages carry the native libraries for all three systems.
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Self-contained, so players don't need .NET installed. Tarballs keep the executable bit on macOS and Linux.
      - name: Publish
        run: |
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            dotnet publish src/PuzzleBoy --configuration Release --runtime "$rid" --self-contained --output "out/$rid"
          done
          (cd out/win-x64 && zip -qr ../../puzzle-boy-win-x64.zip .)
          for rid in linux-x64 osx-arm64 osx-x64; do
            tar -czf "puzzle-boy-$rid.tar.gz" -C "out/$rid" .
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: puzzle-boy
          path: puzzle-boy-*

  start:
    # CI has no game install, so this only proves each build launches on its own system: it must reach the
    # "no game here" message. Drawing a stage is checked by hand (Windows, and Linux under WSL).
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: puzzle-boy

      - name: Start without the game
        shell: bash
        run: |
          mkdir app
          if [ "${{ matrix.rid }}" = win-x64 ]; then unzip -q puzzle-boy-win-x64.zip -d app; else tar -xzf "puzzle-boy-${{ matrix.rid }}.tar.gz" -C app; fi
          out=$(./app/PuzzleBoy no-game-here 2>&1 || true)
          echo "$out" | head -5
          echo "$out" | grep -q "There's no Shin Megami Tensei III Nocturne HD Remaster at no-game-here"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: puzzle-boy

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" puzzle-boy-* --repo "$GITHUB_REPOSITORY" --title "Puzzle Boy $GITHUB_REF_NAME" --generate-notes
